[package]
name = "wd-tagger"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/p1atdev/wd-tagger-rs"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
name = "wdtagger"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tagger"
path = "src/cli/main.rs"
required-features = ["cli"]


[features]
default = ["cli"]
cli = ["clap", "tokio", "tokio-stream"]

cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
coreml = ["ort/coreml"]

[dependencies]
hf-hub = "0.4.1"
ort = { version = "2.0.0-rc.9" }
anyhow = "1.0.95"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
image = "0.25.5"
serde = "1.0.217"
serde_json = "1.0.138"
ndarray = { version = "0.16", features = ["rayon"] }
csv = "1.3.1"
itertools = "0.14.0"
indexmap = "2.7.1"
futures = "0.3.31"

clap = { version = "4.5.28", features = ["derive"], optional = true }
tokio = { version = "1.43.0", features = ["full"], optional = true }
tokio-stream = { version = "0.1.17", optional = true }

[dev-dependencies]
rand = "0.9.0"

[profile.release]
lto = true
